# Production de Repas (ADR 0017). Les images viennent de GHCR, publiées par `.github/workflows/release.yml` :
# rien n'est construit sur le serveur. Copié dans /opt/repas par chaque release du back ; les variables sont dans
# /opt/repas/.env (modèle : `.env.example`).
name: repas-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  # Bordure : seul service exposé. HTTPS automatique (Let's Encrypt), un site par nom de domaine (voir `Caddyfile`).
  edge:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      LEGACY_HOST: ${LEGACY_HOST:?LEGACY_HOST manquant}
      APP_HOST: ${APP_HOST:?APP_HOST manquant}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL manquant}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Les certificats déjà obtenus par l'ancienne installation peuvent être repris : CADDY_DATA_VOLUME=repas_caddy_data
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

  php:
    # `none` tant qu'aucune version n'est déployée : permet de démarrer la base seule (amorçage), jamais le back.
    image: ${BACK_IMAGE:-ghcr.io/kcharignon/repas}:${BACK_TAG:-none}
    restart: unless-stopped
    logging: *logging
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?APP_SECRET manquant}
      # Pas de HTTPS dans le back : il est derrière la bordure, qui seule parle à Internet.
      SERVER_NAME: ":80"
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@database:5432/${POSTGRES_DB:?}?serverVersion=16&charset=utf8
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?JWT_PASSPHRASE manquant}
      # Emails (confirmation d'adresse, ADR 0020) : DSN du fournisseur d'envoi (secret) et expéditeur ; le lien du mail mène au front.
      MAILER_DSN: ${MAILER_DSN:?MAILER_DSN manquant}
      MAILER_FROM: ${MAILER_FROM:?MAILER_FROM manquant}
      FRONT_URL: https://${APP_HOST}
      # Envoi de la liste au drive : coupé tant que l'humain ne l'allume pas. Variable listée ici avec sa valeur par défaut, sinon
      # la valeur du .env embarqué dans l'image (composer dump-env prod) s'appliquerait en silence.
      DRIVE_ENABLED: ${DRIVE_ENABLED:-false}
      # Amorçage des ingrédients à l'activation d'un compte (ING-008, ADR 0028) : coupé tant que l'humain ne l'allume pas. Listée ici avec sa
      # valeur par défaut pour la même raison que DRIVE_ENABLED (.env embarqué dans l'image).
      INGREDIENT_SEEDING_ENABLED: ${INGREDIENT_SEEDING_ENABLED:-false}
      # Version de l'application Android (DRV-637) : dernière publiée et plus ancienne encore attendue (`0.1.10`). Vides par défaut :
      # personne n'est invité à mettre à jour. Listées ici pour la même raison que DRIVE_ENABLED (.env embarqué dans l'image).
      APP_LATEST_VERSION: ${APP_LATEST_VERSION:-}
      APP_MIN_VERSION: ${APP_MIN_VERSION:-}
      # Sans cela, Symfony verrait l'adresse de la bordure pour tous les visiteurs : plafonds de débit par IP faussés,
      # cookie `Secure` et URLs absolues en http.
      SYMFONY_TRUSTED_PROXIES: PRIVATE_SUBNETS
      # Même origine entre le SPA et l'API : le CORS ne sert à rien en production.
      CORS_ALLOW_ORIGIN: ^https://${APP_HOST}$$
      # Le Caddyfile du back déclare Mercure (inutilisé par l'application) et exige ses clés.
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:?MERCURE_JWT_SECRET manquant}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:?MERCURE_JWT_SECRET manquant}
    volumes:
      # Clés JWT : générées une fois au premier démarrage (docker-entrypoint.sh), à conserver d'un déploiement à l'autre.
      - jwt:/app/config/jwt

  front:
    image: ${FRONT_IMAGE:-ghcr.io/kcharignon/repas-front}:${FRONT_TAG:-none}
    # Démarré seulement quand FRONT_TAG est renseigné (deploy.sh active le profil).
    profiles: [front]
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d \"$$POSTGRES_DB\" -U \"$$POSTGRES_USER\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  jwt:
  caddy_data:
    name: ${CADDY_DATA_VOLUME:-repas-prod_caddy_data}
  caddy_config:
