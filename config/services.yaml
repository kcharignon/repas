#config/services.yaml
imports:
    - { resource: repositories.yaml }

parameters:
    env(ADMIN_PASSWORD): '%env(ADMIN_PASSWORD)%'
    # Le cookie du refresh token (ADR 0015) n'est envoyé qu'en HTTPS ; le client de test parle en HTTP
    app.refresh_cookie_secure: true

    # Environnements où la migration d'adoption des communs (ING-003) accepte d'écrire (--apply, --undo) ; `test` s'y ajoute en test
    repas.adoption.environments: ['prod', 'dev']

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    Repas\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    Repas\Command\ResetDatabaseCommand:
        tags: ['console.command']
        
    Repas\Shared\Application\Service\CommandBus:
        arguments:
            $messageBus: '@command.bus'

    Repas\Shared\Application\Service\QueryBus:
        arguments:
            $messageBus: '@query.bus'

    # Le graphe de conversions est mis en cache dans le service : vidé entre deux requêtes (mode worker FrankenPHP)
    Repas\Repas\Domain\Service\ConversionService:
        tags:
            - { name: kernel.reset, method: clear }

    # Port de la commande vocale (ADR 0029, VOX-103) : le contexte `Voice` ajoute à la liste de courses sans importer `Repas`
    Repas\Shared\Application\Interface\VoiceShoppingList:
        alias: Repas\Repas\Infrastructure\Voice\VoiceShoppingListAdapter
        public: true

    # Port de la commande vocale (ADR 0029, VOX-102) : le contexte `Voice` trouve l'ingrédient d'une phrase sans importer `Repas`
    Repas\Shared\Application\Interface\SpokenIngredientResolver:
        alias: Repas\Repas\Infrastructure\Voice\SpokenIngredientResolverAdapter
        public: true

    # Port de la commande vocale (ADR 0029 décision 11, VOX-303) : le contexte `Voice` crée l'ingrédient qu'Alexa ne connaît pas, sans importer `Repas`
    Repas\Shared\Application\Interface\SpokenIngredientCreator:
        alias: Repas\Repas\Infrastructure\Voice\SpokenIngredientCreatorAdapter
        public: true

    # Vérificateur des requêtes d'Alexa (ADR 0029 décision 7, VOX-203) : OpenSSL, la chaîne d'Amazon téléchargée puis gardée 24 h.
    # Aucune racine n'est injectée en production : le magasin du système. L'identifiant du skill vient de `ALEXA_SKILL_ID`.
    Repas\Voice\Domain\Interface\AlexaRequestVerifier:
        alias: Repas\Voice\Infrastructure\Security\OpenSslAlexaRequestVerifier
        public: true

    Repas\Voice\Domain\Interface\CertificateChainFetcher:
        alias: Repas\Voice\Infrastructure\Security\HttpCertificateChainFetcher
        public: true

    Repas\User\Domain\Service\UserChecker: ~
    

when@test:
    parameters:
        app.refresh_cookie_secure: false
        repas.adoption.environments: ['prod', 'dev', 'test']

    services:
        # Pas de journal sur la sortie d'erreur : les tests qui provoquent une panne exprès (suppression ou amorçage qui échoue) n'affichent
        # plus de « Uncaught PHP Exception » ; ceux qui lisent un journal injectent leur propre espion (SpyLogger, BufferingLogger).
        logger:
            class: Psr\Log\NullLogger

        # État des limiteurs (inscription, connexion) : en mémoire, conservé tant que le noyau de test vit (un pool du framework
        # serait vidé à chaque requête par `kernel.reset`), perdu quand il est reconstruit entre deux tests.
        test.rate_limiter_pool:
            class: Symfony\Component\Cache\Adapter\ArrayAdapter

        # Messages et handlers factices de tests/Helper/Bus (voir tests/Shared/Application/Service/BusWiringTest.php)
        Repas\Tests\Helper\Bus\:
            resource: '../tests/Helper/Bus/'
            autowire: true
            autoconfigure: true

        # Routes d'essai de l'interrupteur du drive (voir config/routes.yaml)
        Repas\Tests\Helper\Http\:
            resource: '../tests/Helper/Http/'
            autowire: true
            autoconfigure: true

        # Comptage des requêtes SQL par use case (tests/Repas/WriteBudget, voir ADR 0010 et roadmap phase 8)
        Repas\Tests\Helper\SqlBudget\QueryCounter: ~
        Repas\Tests\Helper\SqlBudget\CountingMiddleware:
            autowire: true
            tags: ['doctrine.middleware']
