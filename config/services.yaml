#config/services.yaml
imports:
    - { resource: repositories.yaml }

parameters:
    # Le cookie du refresh token (ADR 0015) n'est envoyé qu'en HTTPS ; le client de test parle en HTTP
    app.refresh_cookie_secure: true

    # Environnements où la migration d'adoption des communs (ING-003) accepte d'écrire (--apply, --undo) ; `test` s'y ajoute en test
    repas.adoption.environments: ['prod', 'dev']

    # Magasin des verrous (config/packages/lock.yaml, .env) ; en mémoire en test (bloc `when@test` plus bas)
    repas.lock_dsn: '%env(LOCK_DSN)%'

    # Les enseignes du registre du drive (DRV-702) : `DRIVE_RETAILERS` n'allume que celles-là, un identifiant inconnu est ignoré et journalisé.
    # La liste vient du registre lui-même (`Shared` ne nomme aucune enseigne) ; ce fichier de configuration n'en nomme aucune non plus.
    repas.drive.known_retailers: !php/const Repas\Drive\Domain\Model\Retailer::IDS

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    Repas\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            # Les fixtures étendent des classes de doctrine/doctrine-fixtures-bundle (dépendance de développement, bundle chargé en dev et en test) :
            # elles ne sont des services que dans ces deux environnements (blocs `when@dev` et `when@test` plus bas)
            - '../src/*/Infrastructure/DataFixture/'

    Repas\Shared\Infrastructure\Console\ResetDatabaseCommand:
        tags: ['console.command']
        
    Repas\Shared\Application\Service\CommandBus:
        arguments:
            $messageBus: '@command.bus'

    Repas\Shared\Application\Service\QueryBus:
        arguments:
            $messageBus: '@query.bus'

    # Le graphe de conversions est mis en cache dans le service : vidé entre deux requêtes (mode worker FrankenPHP)
    Repas\Repas\Domain\Service\ConversionService:
        tags:
            - { name: kernel.reset, method: clear }

    # Ouverture à la demande de la liste en cours d'un type (ADR 0036 décision 7, LST-004) : les ajouts de LST-005 s'en serviront ; public
    # pour qu'un test de bout en bout s'en serve sur la vraie base
    Repas\Repas\Application\Service\ActiveListForType:
        public: true

    # Port de la commande vocale (ADR 0029, VOX-103 ; ADR 0035) : le contexte `Voice` ajoute à la liste de courses et en retire sans importer `Repas`.
    # Public pour qu'un test de bout en bout s'en serve
    Repas\Voice\Application\Port\ShoppingListItemCommandPort:
        alias: Repas\Voice\Infrastructure\Acl\ShoppingListItemCommandAdapter
        public: true

    # Port des ingrédients de la commande vocale (ADR 0029 décisions 3 et 11, ADR 0035) : public pour qu'un test de bout en bout le remplace
    Repas\Voice\Application\Port\IngredientResolutionCommandPort:
        alias: Repas\Voice\Infrastructure\Acl\IngredientResolutionCommandAdapter
        public: true

    # Ports de la commande vocale (ADR 0029 décision 13, VOX-305 ; ADR 0035) : le contexte `Voice` trouve la recette d'une phrase et planifie un repas
    # sans importer `Repas`. Publics pour qu'un test de bout en bout les remplace
    Repas\Voice\Application\Port\RecipeResolutionCommandPort:
        alias: Repas\Voice\Infrastructure\Acl\RecipeResolutionCommandAdapter
        public: true

    Repas\Voice\Application\Port\MealPlanCommandPort:
        alias: Repas\Voice\Infrastructure\Acl\MealPlanCommandAdapter
        public: true

    # Vérificateur des requêtes d'Alexa (ADR 0029 décision 7, VOX-203) : OpenSSL, la chaîne d'Amazon téléchargée puis gardée 24 h.
    # Aucune racine n'est injectée en production : le magasin du système. L'identifiant du skill vient de `ALEXA_SKILL_ID`.
    Repas\Voice\Domain\Interface\AlexaRequestVerifier:
        alias: Repas\Voice\Infrastructure\Security\OpenSslAlexaRequestVerifier
        public: true

    Repas\Voice\Domain\Interface\CertificateChainFetcher:
        alias: Repas\Voice\Infrastructure\Security\HttpCertificateChainFetcher
        public: true

    # Propriétaire du catalogue d'ingrédients (ADR 0028, amendement du 2026-10-20) : le compte protégé, ou, en développement seulement, celui
    # que désigne `INGREDIENT_CATALOG_OWNER_EMAIL` (vide dans `.env`, jamais posée en production). Les deux Open Host Services (écriture et
    # lecture, ADR 0035) lisent la même variable.
    Repas\User\Application\OpenHostService\CatalogOwnerCommandOHS:
        arguments:
            $overrideEmail: '%env(default::INGREDIENT_CATALOG_OWNER_EMAIL)%'

    Repas\User\Application\OpenHostService\CatalogOwnerQueryOHS:
        arguments:
            $overrideEmail: '%env(default::INGREDIENT_CATALOG_OWNER_EMAIL)%'

    Repas\User\Domain\Service\UserChecker: ~

    # Verrous des compteurs de débit (`lock_factory` de config/packages/rate_limiter.yaml) : le magasin du framework (LOCK_DSN), au plus
    # 256 verrous distincts. Les sections critiques d'un compte, plus longues, prennent `lock.factory` (un verrou par ressource).
    repas.lock_store:
        class: Symfony\Component\Lock\PersistingStoreInterface
        factory: ['Symfony\Component\Lock\Store\StoreFactory', 'createStore']
        arguments: ['%repas.lock_dsn%']

    Repas\Shared\Infrastructure\RateLimiter\BoundedLockFactory:
        arguments:
            $store: '@repas.lock_store'


when@dev:
    services:
        # Fixtures de développement (voir l'exclusion de `Repas\` plus haut)
        Repas\Repas\Infrastructure\DataFixture\:
            resource: '../src/Repas/Infrastructure/DataFixture/'
            autowire: true
            autoconfigure: true

        Repas\User\Infrastructure\DataFixture\:
            resource: '../src/User/Infrastructure/DataFixture/'
            autowire: true
            autoconfigure: true

when@test:
    parameters:
        app.refresh_cookie_secure: false
        repas.adoption.environments: ['prod', 'dev', 'test']
        # Un seul processus par test de base : les verrous restent en mémoire (tests/Shared/Infrastructure/RateLimiter prouve le vrai
        # magasin avec plusieurs processus)
        repas.lock_dsn: 'in-memory'

    services:
        # Fixtures de développement, chargées aussi par les tests de `DevelopmentFixturesTest` (voir l'exclusion de `Repas\` plus haut)
        Repas\Repas\Infrastructure\DataFixture\:
            resource: '../src/Repas/Infrastructure/DataFixture/'
            autowire: true
            autoconfigure: true

        Repas\User\Infrastructure\DataFixture\:
            resource: '../src/User/Infrastructure/DataFixture/'
            autowire: true
            autoconfigure: true

        # Pas de journal sur la sortie d'erreur : les tests qui provoquent une panne exprès (suppression ou amorçage qui échoue) n'affichent
        # plus de « Uncaught PHP Exception » ; ceux qui lisent un journal injectent leur propre espion (SpyLogger, BufferingLogger).
        logger:
            class: Psr\Log\NullLogger

        # État des limiteurs (inscription, connexion) : en mémoire, conservé tant que le noyau de test vit (un pool du framework
        # serait vidé à chaque requête par `kernel.reset`), perdu quand il est reconstruit entre deux tests.
        test.rate_limiter_pool:
            class: Symfony\Component\Cache\Adapter\ArrayAdapter

        # Contrat OpenAPI généré (config/packages/nelmio_api_doc.yaml) : en mémoire, conservé tant que le noyau de test vit, comme le pool
        # des limiteurs.
        test.api_doc_pool:
            class: Symfony\Component\Cache\Adapter\ArrayAdapter

        # Messages et handlers factices de tests/Helper/Bus (voir tests/Shared/Application/Service/BusWiringTest.php)
        Repas\Tests\Helper\Bus\:
            resource: '../tests/Helper/Bus/'
            autowire: true
            autoconfigure: true

        # Routes d'essai de l'interrupteur du drive (voir config/routes.yaml)
        Repas\Tests\Helper\Http\:
            resource: '../tests/Helper/Http/'
            autowire: true
            autoconfigure: true

        # Comptage des requêtes SQL par use case (tests/Repas/WriteBudget, voir ADR 0010 et roadmap phase 8)
        Repas\Tests\Helper\SqlBudget\QueryCounter: ~
        Repas\Tests\Helper\SqlBudget\CountingMiddleware:
            autowire: true
            tags: ['doctrine.middleware']
