# API JSON /api/v1 (ADR 0007) : un dossier Http/Api/{UseCase}/ par contexte
shared_api_controllers:
    resource:
        path: ../src/Shared/Infrastructure/Http/Api/
        namespace: Repas\Shared\Infrastructure\Http\Api
    type: attribute

repas_api_controllers:
    resource:
        path: ../src/Repas/Infrastructure/Http/Api/
        namespace: Repas\Repas\Infrastructure\Http\Api
    type: attribute

user_api_controllers:
    resource:
        path: ../src/User/Infrastructure/Http/Api/
        namespace: Repas\User\Infrastructure\Http\Api
    type: attribute

drive_api_controllers:
    resource:
        path: ../src/Drive/Infrastructure/Http/Api/
        namespace: Repas\Drive\Infrastructure\Http\Api
    type: attribute

voice_api_controllers:
    resource:
        path: ../src/Voice/Infrastructure/Http/Api/
        namespace: Repas\Voice\Infrastructure\Http\Api
    type: attribute

# Point d'entrée du json_login (firewall `login`) : intercepté par le firewall, la route doit exister.
api_login_check:
    path: /api/login_check
    methods: [POST]

when@test:
    # Routes d'essai de l'interrupteur du drive (tests/Helper/Http), absentes de dev et de prod
    test_probe_controllers:
        resource:
            path: ../tests/Helper/Http/
            namespace: Repas\Tests\Helper\Http
        type: attribute
