# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    # Ni session ni CSRF : le back ne sert que l'API JSON stateless authentifiée par JWT (ADR 0008, ADR 0018).
    # Pas de profileur non plus : il écrirait une trace de chaque requête (corps compris) et ajouterait `X-Debug-Token`.

when@test:
    framework:
        test: true
        # Les tests d'API provoquent volontairement des 401, 403, 404, 405, 409 et 422 : les erreurs HTTP et les exceptions de
        # domaine (relayées en JSON par ApiExceptionListener) ne s'écrivent pas sur la sortie de PHPUnit. Une exception
        # inattendue (RuntimeException, TypeError…) reste journalisée.
        exceptions:
            Symfony\Component\HttpKernel\Exception\HttpException:
                log_level: debug
            Repas\Shared\Domain\Exception\DomainException:
                log_level: debug
