nelmio_api_doc:
    documentation:
        info:
            title: Repas API
            description: >-
                API JSON de l'application Repas (recettes, ingrédients, listes de courses). Voir docs/adr/0007-api-rest-v1.md. Les écritures
                de Repas (POST, PUT, PATCH et DELETE ; pas celles du drive, des comptes ni de la commande vocale) sont limitées à 300 par
                minute et par utilisateur : au-delà, 429 avec le message `WRITE_RATE_LIMITED` et l'en-tête `Retry-After`, rien n'est enregistré.
            version: 1.0.0
        components:
            parameters:
                IfMatch:
                    name: If-Match
                    in: header
                    required: false
                    description: >-
                        Version (ETag) de la ressource lue par le client, entre guillemets. Absent : pas de contrôle (la dernière
                        écriture gagne). Une autre version répond 412 (la ressource a été modifiée depuis la lecture) ; une
                        modification simultanée détectée à l'enregistrement répond 409. ADR 0016.
                    schema: { type: string, example: '"3"' }
            # Réponses 429 du drive (DRV-615), référencées par #[OA\Response(response: 429, ref: '#/components/responses/…')]
            responses:
                DriveWriteRateLimited:
                    description: >-
                        Trop d'écritures du drive de cet utilisateur : plus de 60 par minute (compteur commun à `PUT /drive/settings`,
                        `PUT /drive/choices`, `PUT` et `DELETE /drive/choices/{ingredientSlug}`). Message `DRIVE_RATE_LIMITED`,
                        rien n'a été enregistré ; patienter au moins le délai de `Retry-After`, sans réessayer en boucle.
                    headers:
                        Retry-After:
                            description: >-
                                Secondes à attendre au minimum avant de réessayer. Après une rafale le délai annoncé peut n'être que de
                                1 seconde alors que le compteur ne se libère que progressivement : si la requête est encore refusée,
                                patienter jusqu'à une minute
                            schema: { type: integer, minimum: 1, example: 12 }
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    error:
                                        type: object
                                        properties:
                                            message: { type: string, example: DRIVE_RATE_LIMITED }
                DriveReadRateLimited:
                    description: >-
                        Trop de lectures coûteuses du drive de cet utilisateur : plus de 120 par minute (compteur commun à
                        `GET /drive/plans/{shoppingListId}` et `GET /drive/estimates/{shoppingListId}`). Message
                        `DRIVE_RATE_LIMITED` ; patienter au moins le délai de `Retry-After`, sans réessayer en boucle.
                    headers:
                        Retry-After:
                            description: >-
                                Secondes à attendre au minimum avant de réessayer. Après une rafale le délai annoncé peut n'être que de
                                1 seconde alors que le compteur ne se libère que progressivement : si la requête est encore refusée,
                                patienter jusqu'à une minute
                            schema: { type: integer, minimum: 1, example: 12 }
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    error:
                                        type: object
                                        properties:
                                            message: { type: string, example: DRIVE_RATE_LIMITED }
            # Réponses 429 de la commande vocale Alexa (VOX-202, VOX-204), référencées par #[OA\Response(response: 429, ref: '#/components/responses/…')]
            # (même définition `responses` que ci-dessus : une seule clé par composant)
                VoiceTokenRateLimited:
                    description: >-
                        Trop d'échanges de jetons depuis cette adresse IP : plus de 30 par heure (`POST /api/voice/oauth/token`, route
                        publique ; une adresse IPv6 compte par son préfixe /64). Message `VOICE_RATE_LIMITED` au format du dépôt
                        (`{error:{message}}`), pas celui d'OAuth ; patienter au moins le délai de `Retry-After`. Jamais de mise en cache.
                    headers:
                        Retry-After:
                            description: Secondes à attendre au minimum avant de réessayer
                            schema: { type: integer, minimum: 1, example: 120 }
                        Cache-Control:
                            description: '`no-store`'
                            schema: { type: string, example: no-store }
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    error:
                                        type: object
                                        properties:
                                            message: { type: string, example: VOICE_RATE_LIMITED }
                VoiceAuthorizeRateLimited:
                    description: >-
                        Trop de codes d'autorisation émis par cet utilisateur : plus de 20 par heure (`POST /api/v1/voice/alexa/authorize`).
                        Message `VOICE_RATE_LIMITED` ; patienter au moins le délai de `Retry-After`.
                    headers:
                        Retry-After:
                            description: Secondes à attendre au minimum avant de réessayer
                            schema: { type: integer, minimum: 1, example: 120 }
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    error:
                                        type: object
                                        properties:
                                            message: { type: string, example: VOICE_RATE_LIMITED }
                VoiceWebhookRateLimited:
                    description: >-
                        Trop de requêtes depuis cette adresse IP : plus de 60 par minute (`POST /api/voice/alexa`, route publique, plafond posé
                        AVANT la vérification de la signature ; une adresse IPv6 compte par son préfixe /64). Message `VOICE_RATE_LIMITED` ; patienter au moins le délai de `Retry-After`. Le
                        plafond par liaison, lui, ne donne jamais d'erreur HTTP : Alexa répond « Un instant, réessaie dans une minute. ».
                    headers:
                        Retry-After:
                            description: Secondes à attendre au minimum avant de réessayer
                            schema: { type: integer, minimum: 1, example: 30 }
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    error:
                                        type: object
                                        properties:
                                            message: { type: string, example: VOICE_RATE_LIMITED }
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
        security:
            - Bearer: []
        paths:
            # Géré par le firewall `login` (json_login), pas par un controller : documenté ici.
            /api/login_check:
                post:
                    operationId: api_post_login_check
                    tags: [Auth]
                    summary: Obtenir un token JWT
                    security: []
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    required: [email, password]
                                    properties:
                                        email: { type: string, format: email, example: alexiane@example.com }
                                        password: { type: string, format: password }
                    responses:
                        '200':
                            description: Token JWT (durée de vie 3600 s). Pose aussi le cookie `repas_refresh` (HttpOnly, SameSite=Strict, `Path=/api/auth`), à échanger contre un nouveau JWT par `POST /api/auth/refresh` (ADR 0015). Une connexion réussie fait avancer la dernière connexion du compte que voit l'administrateur (`lastLoginAt` de `GET /api/v1/users`), au plus une fois toutes les 10 minutes ; une connexion refusée n'écrit rien
                            headers:
                                Set-Cookie:
                                    description: Refresh token, `HttpOnly; Secure; SameSite=Strict; Path=/api/auth`
                                    schema: { type: string }
                            content:
                                application/json:
                                    schema:
                                        type: object
                                        properties:
                                            token: { type: string }
                        '401':
                            description: Identifiants invalides ou compte désactivé
                            content:
                                application/json:
                                    schema:
                                        type: object
                                        properties:
                                            error:
                                                type: object
                                                properties:
                                                    message: { type: string, example: Invalid credentials. }
    areas:
        path_patterns:
            - ^/api(?!/doc$)
