nelmio_api_doc:
    documentation:
        info:
            title: Repas API
            description: API JSON de l'application Repas (recettes, ingrédients, listes de courses). Voir docs/adr/0007-api-rest-v1.md.
            version: 1.0.0
        components:
            parameters:
                IfMatch:
                    name: If-Match
                    in: header
                    required: false
                    description: >-
                        Version (ETag) de la ressource lue par le client, entre guillemets. Absent : pas de contrôle (la dernière
                        écriture gagne). Une autre version répond 412 (la ressource a été modifiée depuis la lecture) ; une
                        modification simultanée détectée à l'enregistrement répond 409. ADR 0016.
                    schema: { type: string, example: '"3"' }
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
        security:
            - Bearer: []
        paths:
            # Géré par le firewall `login` (json_login), pas par un controller : documenté ici.
            /api/login_check:
                post:
                    operationId: api_post_login_check
                    tags: [Auth]
                    summary: Obtenir un token JWT
                    security: []
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    required: [email, password]
                                    properties:
                                        email: { type: string, format: email, example: alexiane.sichi@gmail.com }
                                        password: { type: string, format: password }
                    responses:
                        '200':
                            description: Token JWT (durée de vie 3600 s). Pose aussi le cookie `repas_refresh` (HttpOnly, SameSite=Strict, `Path=/api/auth`), à échanger contre un nouveau JWT par `POST /api/auth/refresh` (ADR 0015)
                            headers:
                                Set-Cookie:
                                    description: Refresh token, `HttpOnly; Secure; SameSite=Strict; Path=/api/auth`
                                    schema: { type: string }
                            content:
                                application/json:
                                    schema:
                                        type: object
                                        properties:
                                            token: { type: string }
                        '401':
                            description: Identifiants invalides ou compte désactivé
                            content:
                                application/json:
                                    schema:
                                        type: object
                                        properties:
                                            error:
                                                type: object
                                                properties:
                                                    message: { type: string, example: Invalid credentials. }
    areas:
        path_patterns:
            - ^/api(?!/doc$)
