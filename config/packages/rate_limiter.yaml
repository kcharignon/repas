framework:
    rate_limiter:
        # Inscription publique (POST /api/v1/users), par adresse IP (RegisterNewUserRateLimitListener) : un compte créé n'a
        # ni confirmation d'email ni captcha, c'est ce plafond qui limite la création en masse (ADR 0008).
        registration:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        # Rafraîchissement du JWT (POST /api/auth/refresh), par adresse IP (RefreshTokenRateLimitListener, ADR 0015 §9) :
        # un SPA le sollicite à chaque rechargement de page et toutes les heures, 60 par 10 minutes laissent de la marge.
        refresh_token:
            policy: sliding_window
            limit: 60
            interval: '10 minutes'

when@test:
    framework:
        rate_limiter:
            registration:
                cache_pool: test.rate_limiter_pool
            refresh_token:
                cache_pool: test.rate_limiter_pool
