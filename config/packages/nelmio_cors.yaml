nelmio_cors:
    defaults:
        # Aucune origine autorisée hors /api.
        allow_origin: []
    paths:
        '^/api/':
            origin_regex: true
            allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
            allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
            allow_headers: ['Content-Type', 'Authorization', 'X-App-Version', 'X-App-Platform']
            expose_headers: ['Link', 'Location']
            max_age: 3600
