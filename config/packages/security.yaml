#packages\security.yaml
security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        user_model_provider:
            id: Repas\User\Domain\Service\UserProvider
    firewalls:
        # Échange du refresh token (cookie) contre un JWT et déconnexion (ADR 0015 §10) : hors sécurité, l'identité vient du
        # seul cookie ; un `Authorization: Bearer` expiré ne doit pas faire échouer l'échange qui le remplace.
        auth:
            pattern: ^/api/auth
            security: false
        # Commande vocale Alexa (ADR 0029) : l'échange des jetons de la liaison de compte et, plus tard, le webhook sont appelés par
        # Amazon, qui n'a pas de JWT. Hors sécurité par construction : le client s'authentifie par ses identifiants OAuth (échange des
        # jetons) ou par la signature d'Amazon (webhook), et le plafond de débit et l'interrupteur `ALEXA_ENABLED` sont posés par les
        # controllers (`#[VoiceRateLimited]`, `#[RequiresVoice]`). Un jeton d'accès Alexa est opaque : il n'est JAMAIS accepté par le firewall
        # `api` (JWT) ci-dessous, et l'autorisation (`/api/v1/voice/…`) reste derrière le JWT de l'utilisateur.
        voice:
            pattern: ^/api/voice(/|$)
            security: false
        # Connexion : échange email + mot de passe contre un JWT (ADR 0008).
        login:
            pattern: ^/api/login
            stateless: true
            provider: user_model_provider
            user_checker: Repas\User\Domain\Service\UserChecker
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            # Plafond des échecs : 5 par 15 minutes pour un couple adresse + email, 25 pour une même adresse, 20 puis un toutes les
            # 3 minutes pour un même email (ADR 0008, chiffres dans rate_limiter.yaml) ; au-delà : 429
            login_throttling:
                limiter: Repas\User\Infrastructure\Security\LoginRateLimiter
        # API JSON stateless authentifiée par JWT (ADR 0008). Aucune session, aucun cookie d'authentification.
        api:
            pattern: ^/api
            stateless: true
            provider: user_model_provider
            user_checker: Repas\User\Domain\Service\UserChecker
            jwt: ~

    # Le back ne sert que /api : tout le reste est du front statique, servi par la bordure (ADR 0017).
    access_control:
        - { path: ^/api/v1/health, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/users$, roles: PUBLIC_ACCESS, methods: [POST] } # inscription
        - { path: ^/api/v1/users/email-verification/(send|confirm)$, roles: PUBLIC_ACCESS, methods: [POST] } # confirmation d'adresse email (ADR 0020)
        - { path: ^/api/v1/users/password-reset/(send|confirm)$, roles: PUBLIC_ACCESS, methods: [POST] } # mot de passe oublié (ADR 0026)
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        # Les compteurs de connexion sont en mémoire en test (config/packages/rate_limiter.yaml, test.rate_limiter_pool)
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
