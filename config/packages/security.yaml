#packages\security.yaml
security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        user_model_provider:
            id: Repas\User\Domain\Service\UserProvider
    firewalls:
        # Échange du refresh token (cookie) contre un JWT et déconnexion (ADR 0015 §10) : hors sécurité, l'identité vient du
        # seul cookie ; un `Authorization: Bearer` expiré ne doit pas faire échouer l'échange qui le remplace.
        auth:
            pattern: ^/api/auth
            security: false
        # Connexion : échange email + mot de passe contre un JWT (ADR 0008).
        login:
            pattern: ^/api/login
            stateless: true
            provider: user_model_provider
            user_checker: Repas\User\Domain\Service\UserChecker
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            # 5 échecs par 15 minutes pour un couple IP + email, 25 pour une même IP (ADR 0008) ; au-delà : 429
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
        # API JSON stateless authentifiée par JWT (ADR 0008). Aucune session, aucun cookie d'authentification.
        api:
            pattern: ^/api
            stateless: true
            provider: user_model_provider
            user_checker: Repas\User\Domain\Service\UserChecker
            jwt: ~

    # Le back ne sert que /api : tout le reste est du front statique, servi par la bordure (ADR 0017).
    access_control:
        - { path: ^/api/v1/health, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/users$, roles: PUBLIC_ACCESS, methods: [POST] } # inscription
        - { path: ^/api/v1/users/email-verification/(send|confirm)$, roles: PUBLIC_ACCESS, methods: [POST] } # confirmation d'adresse email (ADR 0020)
        - { path: ^/api/v1/users/password-reset/(send|confirm)$, roles: PUBLIC_ACCESS, methods: [POST] } # mot de passe oublié (ADR 0026)
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        # Compteurs de connexion en mémoire (test.rate_limiter_pool, config/services.yaml) : un test ne voit pas les tentatives d'un autre
        firewalls:
            login:
                login_throttling:
                    cache_pool: test.rate_limiter_pool
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
