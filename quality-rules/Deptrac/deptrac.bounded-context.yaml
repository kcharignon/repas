# Contextes étanches (ADR 0001, 0013, 0035) : Repas, User, Drive et Voice ne s'importent pas. Un contexte ne dépend que de Shared
# et de lui-même ; la seule porte vers un autre contexte est sa couche anticorruption (`Infrastructure/Acl/*CommandAdapter` ou
# `*QueryAdapter`), qui appelle l'Open Host Service du MÊME genre chez le producteur (`Application/OpenHostService/*CommandOHS`
# ou `*QueryOHS`) et lit seulement ce qu'il publie :
#   - un CommandAdapter lit les Model (`Domain/Model`) que rend un CommandOHS ;
#   - un QueryAdapter lit les DTO (`Application/OpenHostService/**/*DTO`) que rend un QueryOHS ;
#   - les deux peuvent attraper les exceptions du producteur (`Domain/Exception`).
# Les couches ci-dessous sont DISJOINTES (chaque classe d'un contexte est dans une seule) ; `<Contexte>` est tout le reste du contexte.
# Les fixtures de développement composent les contextes (une fixture Repas référence un utilisateur) : elles sont hors de ces
# règles, comme le code de test. `Shared` n'importe aucun contexte.
deptrac:
  paths:
    - ../../src
  layers:
    - name: Shared
      collectors:
        - type: classLike
          value: ^Repas\\Shared\\.*
    - name: RepasCommandOhs
      collectors:
        - type: classLike
          value: ^Repas\\Repas\\Application\\OpenHostService\\.*CommandOHS$
    - name: RepasQueryOhs
      collectors:
        - type: classLike
          value: ^Repas\\Repas\\Application\\OpenHostService\\.*QueryOHS$
    - name: RepasOhsDto
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^Repas\\Repas\\Application\\OpenHostService\\.*
          must_not:
            - type: classLike
              value: .*(CommandOHS|QueryOHS)$
    - name: RepasCommandAcl
      collectors:
        - type: classLike
          value: ^Repas\\Repas\\Infrastructure\\Acl\\.*CommandAdapter$
    - name: RepasQueryAcl
      collectors:
        - type: classLike
          value: ^Repas\\Repas\\Infrastructure\\Acl\\.*QueryAdapter$
    - name: RepasModel
      collectors:
        - type: classLike
          value: ^Repas\\Repas\\Domain\\Model\\.*
    - name: RepasException
      collectors:
        - type: classLike
          value: ^Repas\\Repas\\Domain\\Exception\\.*
    - name: Repas
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^Repas\\Repas\\.*
          must_not:
            - type: classLike
              value: ^Repas\\Repas\\Application\\OpenHostService\\.*
            - type: classLike
              value: ^Repas\\Repas\\Infrastructure\\Acl\\.*
            - type: classLike
              value: ^Repas\\Repas\\Domain\\(Model|Exception)\\.*
            - type: classLike
              value: ^Repas\\Repas\\Infrastructure\\DataFixture\\.*
    - name: UserCommandOhs
      collectors:
        - type: classLike
          value: ^Repas\\User\\Application\\OpenHostService\\.*CommandOHS$
    - name: UserQueryOhs
      collectors:
        - type: classLike
          value: ^Repas\\User\\Application\\OpenHostService\\.*QueryOHS$
    - name: UserOhsDto
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^Repas\\User\\Application\\OpenHostService\\.*
          must_not:
            - type: classLike
              value: .*(CommandOHS|QueryOHS)$
    - name: UserCommandAcl
      collectors:
        - type: classLike
          value: ^Repas\\User\\Infrastructure\\Acl\\.*CommandAdapter$
    - name: UserQueryAcl
      collectors:
        - type: classLike
          value: ^Repas\\User\\Infrastructure\\Acl\\.*QueryAdapter$
    - name: UserModel
      collectors:
        - type: classLike
          value: ^Repas\\User\\Domain\\Model\\.*
    - name: UserException
      collectors:
        - type: classLike
          value: ^Repas\\User\\Domain\\Exception\\.*
    - name: User
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^Repas\\User\\.*
          must_not:
            - type: classLike
              value: ^Repas\\User\\Application\\OpenHostService\\.*
            - type: classLike
              value: ^Repas\\User\\Infrastructure\\Acl\\.*
            - type: classLike
              value: ^Repas\\User\\Domain\\(Model|Exception)\\.*
            - type: classLike
              value: ^Repas\\User\\Infrastructure\\DataFixture\\.*
    - name: DriveCommandOhs
      collectors:
        - type: classLike
          value: ^Repas\\Drive\\Application\\OpenHostService\\.*CommandOHS$
    - name: DriveQueryOhs
      collectors:
        - type: classLike
          value: ^Repas\\Drive\\Application\\OpenHostService\\.*QueryOHS$
    - name: DriveOhsDto
      collectors:
