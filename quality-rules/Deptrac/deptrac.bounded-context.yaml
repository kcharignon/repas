# Bounded contexts (ADR 0001, 0013, 0022) : Repas, User et Drive dépendent de Shared ; Shared n'importe aucun contexte.
# Aucune dépendance entre contextes n'est tolérée (plus de baseline depuis le lot « User par identifiant ») : ce qui doit
# circuler entre eux est dans Shared (événements de `Shared\Domain\Event`, interface `AuthenticatedUser`, port
# `OwnershipLoader`, classe de base des repositories Doctrine).
# Les fixtures de développement composent les contextes (une fixture Repas référence un utilisateur) : elles sont hors
# de ces règles, comme le code de test.
deptrac:
  paths:
    - ../../src
  layers:
    - name: Shared
      collectors:
        - type: classLike
          value: ^Repas\\Shared\\.*
    - name: Repas
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^Repas\\Repas\\.*
          must_not:
            - type: classLike
              value: ^Repas\\Repas\\Infrastructure\\DataFixture\\.*
    - name: User
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^Repas\\User\\.*
          must_not:
            - type: classLike
              value: ^Repas\\User\\Infrastructure\\DataFixture\\.*
    - name: Drive
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^Repas\\Drive\\.*
          must_not:
            - type: classLike
              value: ^Repas\\Drive\\Infrastructure\\DataFixture\\.*

  ruleset:
    Repas:
      - Shared
    User:
      - Shared
    Drive:
      - Shared
