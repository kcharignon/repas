          must:
            - type: classLike
              value: ^Repas\\Drive\\Application\\OpenHostService\\.*
          must_not:
            - type: classLike
              value: .*(CommandOHS|QueryOHS)$
    - name: DriveCommandAcl
      collectors:
        - type: classLike
          value: ^Repas\\Drive\\Infrastructure\\Acl\\.*CommandAdapter$
    - name: DriveQueryAcl
