# ADR 0010 : un test de handler (Command ou Query) est unitaire. Il n'utilise ni kernel, ni base, ni Doctrine,
# ni classe d'Infrastructure : la persistance se teste dans tests/*/OutputAdapter (repositories, loaders), jamais
# par transitivité à travers un handler.
deptrac:
  paths:
    - ../../tests
  layers:
    - name: HandlerTest
      collectors:
        - type: classLike
          value: ^Repas\\Tests\\(Repas|User|Drive|Voice)\\Application\\.*
    - name: Persistence
      collectors:
        - type: classLike
          value: ^Repas\\Tests\\Helper\\DatabaseTestCase$
        - type: classLike
          value: ^Symfony\\Bundle\\FrameworkBundle\\Test\\.*
        - type: classLike
          value: ^Doctrine\\.*
        # Sauf la couche anticorruption (ADR 0035) : une transposition pure, qui sert à tester un Open Host Service par transitivité
        - type: bool
          must:
            - type: classLike
              value: ^Repas\\(Repas|User|Drive|Voice|Shared)\\Infrastructure\\.*
          must_not:
            - type: classLike
              value: ^Repas\\(Repas|User|Drive|Voice)\\Infrastructure\\Acl\\.*

  ruleset:
    HandlerTest:
      - '!Persistence'
