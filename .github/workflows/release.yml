name: Release

# Publier une release GitHub (tag vX.Y.Z) construit l'image du back, la publie sur GHCR et la déploie en production
# (ADR 0017). Le front a son propre workflow, dans le dépôt repas-front.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  checks:
    name: Contrôles
    runs-on: ubuntu-latest
    steps:
      -
        name: Version et branche
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Le tag « $TAG » n'est pas une version vX.Y.Z"
            exit 1
          fi
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      -
        name: Le tag est sur main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Le commit de la release n'est pas dans main : on ne déploie que ce qui a été relu et fusionné"
            exit 1
          fi

  tests:
    name: Tests
    needs: checks
    uses: ./.github/workflows/ci.yml

  publish:
    name: Image Docker (GHCR)
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      -
        name: Connexion à GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Construire et publier
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: frankenphp_prod
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Déploiement en production
    needs: publish
    runs-on: ubuntu-latest
    # Un seul déploiement à la fois ; un déploiement commencé n'est jamais interrompu.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Environnement GitHub « production » : on peut y exiger une approbation avant chaque déploiement.
    environment: production
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      -
        name: Copier la configuration et déployer
        env:
          TAG: ${{ github.event.release.tag_name }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh_opts=(-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes)
          scp "${ssh_opts[@]}" deploy/compose.yaml deploy/Caddyfile deploy/deploy.sh deploy/backup.sh deploy/.env.example \
            "$SSH_USER@$SSH_HOST:/opt/repas/"
          # TAG est vérifié par le job Contrôles (vX.Y.Z) : son expansion côté client est voulue
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" "cd /opt/repas && chmod +x deploy.sh backup.sh && ./deploy.sh back $TAG"
          rm -f ~/.ssh/deploy_key
