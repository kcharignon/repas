name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~
  # Appelé par release.yml : une release ne part en production que si toute la CI passe sur son commit.
  workflow_call: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      -
        name: Build Docker images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7
        with:
          pull: true
          load: true
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max
      -
        name: Start services
        run: docker compose up --wait --no-build 
      -
        name: Check HTTP reachability
        run: curl -v --fail-with-body http://localhost
      -
        name: Check HTTPS reachability
        if: false # Remove this line when the homepage will be configured, or change the path to check
        run: curl -vk --fail-with-body https://localhost
      -
        name: Create test database
        run: docker compose exec -T php bin/console -e test doctrine:database:create
      -
        name: Run migrations
        run: docker compose exec -T php bin/console -e test doctrine:migrations:migrate --no-interaction
      -
        name: Generate JWT keys
        run: make jwt-keys EXEC_PHP="docker compose exec -T php"
      -
        # Moteur de couverture rapide (PCOV, ~95 s contre ~260 s avec Xdebug) installé dans le conteneur, sans toucher au Dockerfile.
        # S'il est indisponible (PECL), `make test-ci` retombe sur Xdebug : plus lent, mais même résultat.
        name: Install PCOV
        run: docker compose exec -T php install-php-extensions pcov-1.0.12 || echo "PCOV indisponible, repli sur Xdebug"
      -
        name: Run PHPUnit
        run: make test-ci EXEC_PHP_CI="docker compose exec -T php"
      -
        name: Coverage Checker
        # Seuil en cliquet : on ne le baisse jamais, on le remonte quand la mesure le permet (docs/migration-roadmap.md).
        env:
          COVERAGE_THRESHOLD: 89
        run: |
          OUTPUT=$(docker compose exec -T php vendor/bin/coverage-check clover.xml "$COVERAGE_THRESHOLD" --only-percentage || true)
          PERCENTAGE=$(echo "$OUTPUT" | grep -oE '[0-9]+\.[0-9]+|[0-9]+' | head -1)

          if (( $(echo "$PERCENTAGE >= $COVERAGE_THRESHOLD" | bc -l) )); then
            echo "✅ Success! Coverage is $PERCENTAGE% (>= $COVERAGE_THRESHOLD%)"
            exit 0
          else
            echo "❌ Failed! Coverage is $PERCENTAGE% (< $COVERAGE_THRESHOLD%)"
            exit 1
          fi
      -
        name: Doctrine Schema Validator
        run: docker compose exec -T php bin/console -e test doctrine:schema:validate
      -
        name: Deptrac
        run: make deptrac EXEC_PHP="docker compose exec -T php"
      -
        name: PHPStan
        run: make phpstan EXEC_PHP="docker compose exec -T php"
      -
        name: API documentation
        run: make api-doc-validate api-doc-coverage openapi-check EXEC_PHP="docker compose exec -T php"
  audit:
    name: Security advisories
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      -
        # composer.lock contre les avis de sécurité connus (ADR 0014) ; indépendant de la pile Docker du projet
        name: Composer audit
        run: docker run --rm -v "$PWD":/app -w /app composer:2 composer audit --locked
  deploy-config:
    name: Configuration de production
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      -
        name: Construire l'image de production
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: frankenphp_prod
          load: true
          tags: repas-smoke-back
          cache-from: type=gha,scope=prod
          cache-to: type=gha,scope=prod,mode=max
      -
        # deploy/ : démarrage sur base vide, bordure, API, cookie, déploiement, sauvegarde et retour arrière (ADR 0017)
        name: Essai de bout en bout de deploy/
        run: BACK_IMAGE=repas-smoke-back bash deploy/smoke-test.sh
  lint:
    name: Docker Lint
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      -
        name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
